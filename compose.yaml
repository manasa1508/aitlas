services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: aitlas
      POSTGRES_USER: aitlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aitlas -d aitlas"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  init:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    command: ["python", "-m", "app.bootstrap"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CA_BUNDLE_PATH: ${CA_BUNDLE_PATH:-}
      CA_CERT_BASE64: ${CA_CERT_BASE64:-}
      WORKER_TICK_SECONDS: ${WORKER_TICK_SECONDS:-60}
    command: ["python", "-m", "app.worker"]
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
