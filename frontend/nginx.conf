limit_req_zone $binary_remote_addr zone=ask_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_status 429;

server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream api:8000;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 16k;
  client_body_timeout 10s;
  client_header_timeout 10s;
  proxy_connect_timeout 5s;

  location = /api/ask {
    limit_req zone=ask_limit burst=5 nodelay;
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 40s;
  }

  location /api/ {
    limit_req zone=api_limit burst=30 nodelay;
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 40s;
  }

  location /assets/ {
    expires 1y;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
}
